# Scash Exchange Wallet v0.1.0-beta.1 Standalone Build & Release Workflow

# Target Repository: ScashNetworkCommunity/Scash-peer-to-peer-exchange (forked from ScashNetworkCommunity/scash 2.3.0)

# Save at: .github/workflows/scash-2.4.0-exchange.yml on branch scash_master



name: Scash Exchange Wallet v0.1.0 Build & Release



on:

  workflow_dispatch:

    inputs:

      base_branch:

        description: "Source branch to build from"

        required: true

        default: "scash_master"

        type: string

      target_branch:

        description: "Branch to commit Scash Exchange Wallet v0.1.0 code onto"

        required: true

        default: "scash_master"

        type: string

      open_pull_request:

        description: "Open PR instead of committing directly (if target_branch differs)"

        required: true

        default: false

        type: boolean

      build_linux_debian_ubuntu:

        description: "Build Linux x86_64 release (.tgz with scash-exchange-qt & scash-exchange-qtkawaii)"

        required: true

        default: true

        type: boolean

      build_windows_11:

        description: "Build Windows 11 x64 release (win64-setup.exe & win64-setup.zip)"

        required: true

        default: true

        type: boolean

      create_github_release:

        description: "Create/update Scash Exchange Wallet 0.1.0-beta.1 GitHub Release"

        required: true

        default: true

        type: boolean

      draft_release:

        description: "Create Release as Draft first (uncheck to publish immediately)"

        required: true

        default: true

        type: boolean



permissions:

  contents: write

  pull-requests: write



env:

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"



jobs:

  apply-exchange-wallet-module:

    name: Install Multi-Coin Exchange Module & Run Crypto Unit Tests

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Repository (${{ inputs.base_branch }})

        uses: actions/checkout@v4

        with:

          ref: ${{ inputs.base_branch }}

          fetch-depth: 0

          submodules: recursive



